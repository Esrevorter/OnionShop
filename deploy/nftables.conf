#!/usr/sbin/nft -f
# OnionShop host firewall — default-deny, loopback-only ingress (SECURITY_AND_OPSEC.md).
# This box has NO public listeners: Tor dials OUT to the onion network; admin SSH
# arrives only through a Dropbear private onion service (loopback-tunneled), never here.
# Install: cp to /etc/nftables.conf && systemctl enable --now nftables
flush ruleset

table inet onionshop {
  chain input {
    type filter hook input priority 0; policy drop;

    iif lo accept                          # everything legitimate is loopback or established
    ct state established,related accept
    ct state invalid drop
    iif != lo ip daddr 127.0.0.1/8 drop   # no external spoofed-loopback packets
    ip protocol icmp icmp type echo-request limit rate 5/second accept
    counter reject with icmpx type admin-prohibited   # everything else: explicit reject
  }
  chain forward { type filter hook forward priority 0; policy drop; }
  chain output {
    type filter hook output priority 0; policy drop;
    oif lo accept
    ct state established,related accept
    # Allow ONLY the tor + ntp users out (default-deny egress per OpSec policy).
    meta skuid "tor" accept
    meta skuid "ntp" accept               # if you run systemd-timesyncd instead, delete this line
    # Docker's bridge traffic is governed by DOCKER-USER chains; keep it off the WAN:
    # containers use 'internal: true' networks and have no route out anyway.
  }
}
