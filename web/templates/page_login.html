{{template "layout" .}}

{{define "title"}}Log in &middot; OnionShop{{end}}

{{define "body"}}
<h1>Log in</h1>
<form method="post" action="/login" autocomplete="off">
{{template "friction" .}}
<label>Username
<input type="text" name="username" maxlength="32" required></label>
<label>Password
<input type="password" name="password" maxlength="128" required></label>
<p><button type="submit">Log in</button></p>
</form>
<p><a href="/register">Create an account</a></p>
{{end}}
