version: '3.8'

# Production-ready, high-OpSec Docker Compose for OnionShop.
# Full operator guide: INSTALL.md. Threat model & rules: SECURITY_AND_OPSEC.md.
# WARNING: This file relies on a .env file for ALL secrets (see .env.example).
# NEVER commit .env to Git. The host MUST have LUKS FDE + nftables default-deny
# (deploy/nftables.conf) + Tor (deploy/torrc) configured BEFORE `up`.

x-hardening: &default-hardening        # shared per-service OpSec baseline
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  read_only: true
  tmpfs:
    - /tmp
  logging:                             # logs stay in RAM (json-file on the host
    driver: json-file                  # is capped; journald forwarders must use volatile)
    options: { max-size: "10m", max-file: "2" }

services:
  # 1. Nginx Reverse Proxy (The Gatekeeper)
  # Terminates TLS 1.3 (self-signed; clients pin the SPKI fingerprint) on
  # loopback only, and proxies to the Go app over a SHARED UNIX SOCKET —
  # no TCP hop between nginx and app (SECURITY_AND_OPSEC.md §nginx).
  nginx:
    image: nginx:1.27-alpine           # pinned minor; bump deliberately after review
    <<: *default-hardening
    user: "101:101"                    # 'nginx' user in Alpine
    ports:
      - "127.0.0.1:8443:8443"          # Tor HiddenServicePort target; loopback ONLY
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./web/static:/var/www/static:ro
      - appsock:/run/onionshop         # UNIX socket shared with the app container
    depends_on:
      app:
        condition: service_healthy
    networks: [internal_net]
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8443/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 2. Go Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    <<: *default-hardening
    user: "1000:101"                   # app uid, nginx gid -> can create socket nginx reads
    environment:
      - ONIONSHOP_SOCKET=/run/onionshop/app.sock   # preferred: UNIX socket upstream
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - BTCPAY_API_URL=http://btcpay:49392
      - BTCPAY_API_KEY=${BTCPAY_API_KEY}
      - SESSION_HASH_KEY=${SESSION_HASH_KEY}
      - ONIONSHOP_SECURE_COOKIES=true
      - APP_ENV=production
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [internal_net]
    volumes:
      - appsock:/run/onionshop
    tmpfs: [/tmp, /run/onionshop]      # socket lives on tmpfs, never on disk
    healthcheck:
      # wget --spider sends GET; the app answers HEAD too, so plain spider works
      # against the socket via a tiny unix-capable check inside the image.
      test: ["CMD", "sh", "-c", "printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' | nc -U /run/onionshop/app.sock | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 3. PostgreSQL Database (data on LUKS-backed volume; RAM-only WAL archiving off)
  postgres:
    image: postgres:16-alpine
    <<: *default-hardening
    user: "999:999"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal_net]
    tmpfs: [/var/run/postgresql, /tmp]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Redis (Session & Rate Limiting) — RAM ONLY: persistence fully disabled
  # (appendonly off, save "") so session data never touches disk.
  redis:
    image: redis:7-alpine
    <<: *default-hardening
    user: "999:999"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb --maxmemory-policy noeviction
      --bind 0.0.0.0
      --save "" --appendonly no
      --rename-command FLUSHALL "" --rename-command DEBUG ""
    networks: [internal_net]
    tmpfs: [/tmp]                      # NO /data volume: nothing persisted by design
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5. BTCPay Server
  # Requires outbound access for blockchain sync; placed on btcpay_net (WAN) and
  # internal_net (app reaches it via http). No inbound port is ever published.
  btcpay:
    image: btcpayserver/btcpayserver:latest
    restart: unless-stopped
    user: "1000:1000"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    environment:
      - BTCPAY_POSTGRES=User ID=${DB_USER};Password=${DB_PASSWORD};Host=btcpaydb;Port=5432;Database=btcpay
      - BTCPAY_NETWORK=mainnet
      - BTCPAY_BIND=0.0.0.0:49392
      - BTCPAY_ROOTPATH=/
    depends_on:
      btcpaydb: { condition: service_healthy }
    networks: [internal_net, btcpay_net]

  btcpaydb:
    image: postgres:16-alpine
    <<: *default-hardening
    user: "999:999"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: btcpay
    volumes:
      - btcpay_pgdata:/var/lib/postgresql/data
    networks: [btcpay_net]
    tmpfs: [/var/run/postgresql, /tmp]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d btcpay"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 6. Encrypted Backup Runner (daily cycle; plaintext exists only in tmpfs)
  backup:
    image: alpine:3.19
    restart: unless-stopped
    <<: *default-hardening
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache postgresql16-client age >/dev/null && exec /scripts/backup.sh"]
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - backup_data:/backup
    environment:
      - AGE_PUBLIC_KEY=${AGE_PUBLIC_KEY}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    networks: [internal_net]
    tmpfs: [/tmp]                      # unencrypted dumps happen here briefly in RAM

volumes:
  pgdata:
  btcpay_pgdata:
  backup_data:
  appsock:                             # named volume => shared /run/onionshop socket dir

networks:
  internal_net:
    driver: bridge
    internal: true                     # CRITICAL: no outbound internet for App/DB/Redis/Nginx
  btcpay_net:
    driver: bridge                     # BTCPay needs outbound to sync the blockchain
