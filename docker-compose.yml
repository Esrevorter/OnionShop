# Development/preview stack; production use is gated by PRODUCTION_READINESS.md.
# TLS cert/key must be generated for the exact ONION_HOST using scripts/gen-certs.sh.
# This is a self-signed ECDSA TLS key separate from Tor's Ed25519 key. Tor's
# protocol authenticates the onion endpoint; the TLS certificate does not.
# No CA-issued TLS certs or SPKI/hash pinning are used by project policy.
# Secrets come from a private .env. Docker network isolation is not a substitute
# for an audited host firewall and per-service egress policy.

x-hardening: &default-hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  read_only: true
  tmpfs:
    - /tmp
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "2" }

services:

  # 1. Nginx Reverse Proxy (The Gatekeeper)
  # Terminates TLS 1.3 on loopback only and proxies to the Go app over the
  # shared UNIX socket. group_add grants the socket's group (app gid 1000):
  # the socket is 0770 app:app, and nginx runs as 101:101.
  nginx:
    image: nginx:1.27-alpine           # pinned minor; bump deliberately after review
    <<: *default-hardening
    mem_limit: 200m
    pids_limit: 128
    user: "101:101"                    # 'nginx' user in Alpine
    group_add: ["1000"]                # supplementary access to app.sock (0770)
    ports:
      - "127.0.0.1:8080:8080"          # Tor HiddenServicePort 80 target
      - "127.0.0.1:8443:8443"          # Tor HiddenServicePort 443 target
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./web/static:/var/www/static:ro
      - appsock:/run/onionshop
    depends_on:
      app:
        condition: service_healthy
    networks: [internal_net, edge_net]
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:mode=1777
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "--tries=1",
             "-O", "/dev/null", "https://127.0.0.1:8443/health"]
      interval: 30s
      timeout: 5s
      retries: 3  
  app:
    image: onionshop-app:local
    build:
      context: .
      dockerfile: Dockerfile
    <<: *default-hardening
    user: "1000:101"
    environment:
      - ONIONSHOP_UNIX=/run/onionshop/app.sock
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - SESSION_HASH_KEY=${SESSION_HASH_KEY}
      - ONIONSHOP_SECURE_COOKIES=true
      - APP_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1500m
    pids_limit: 256
    networks: [internal_net]
    tmpfs: [/tmp]
    volumes:
      - appsock:/run/onionshop
    healthcheck:
      test: ["CMD", "/usr/local/bin/onionshop", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  postgres:
    image: postgres:16-alpine # tag-only; verify/pin digest before production
    <<: *default-hardening
    user: "999:999"
    mem_limit: 2000m
    pids_limit: 256
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal_net]
    tmpfs:
      - /var/run/postgresql:mode=1777
      - /tmp:mode=1777
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine # tag-only; verify/pin digest before production
    <<: *default-hardening
    mem_limit: 512m
    pids_limit: 256
    user: "999:999"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb --maxmemory-policy noeviction
      --bind 0.0.0.0
      --save "" --appendonly no
      --rename-command FLUSHALL "" --rename-command DEBUG "" --rename-command CONFIG ""
    networks: [internal_net]
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    <<: *default-hardening
    mem_limit: 1500m
    pids_limit: 128
    entrypoint: ["/bin/sh", "-c", "exec /scripts/backup.sh"]
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - backup_data:/backup
    environment:
      - AGE_PUBLIC_KEY=${AGE_PUBLIC_KEY}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    networks: [internal_net]
    tmpfs: [/tmp]

volumes:
  pgdata:
  backup_data:
  appsock:

networks:
  internal_net:
    driver: bridge
    internal: true
  # edge_net exists ONLY so nginx has a default gateway: Docker publishes ports
  # through the container's default-gateway network, and an internal-only
  # container has none, so `ports:` is silently ignored without this. Required
  # for host-side Tor (deploy/torrc) to reach 127.0.0.1:8443 in production too.
  edge_net:
    driver: bridge
