version: '3.8'

# Production-ready, high-OpSec Docker Compose for OnionShop.
# Full operator guide: INSTALL.md. Threat model & rules: SECURITY_AND_OPSEC.md.
# WARNING: This file relies on a .env file for ALL secrets (see .env.example).
# NEVER commit .env to Git. The host MUST have LUKS FDE + nftables default-deny
# (deploy/nftables.conf) + Tor (deploy/torrc) configured BEFORE `up`.

x-hardening: &default-hardening        # shared per-service OpSec baseline
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  read_only: true
  tmpfs:
    - /tmp
  logging:                             # logs stay in RAM (json-file on the host
    driver: json-file                  # is capped; journald forwarders must use volatile)
    options: { max-size: "10m", max-file: "2" }

services:
  # 1. Nginx Reverse Proxy (The Gatekeeper)
  # Terminates TLS 1.3 (self-signed; clients pin the SPKI fingerprint) on
  # loopback only, and proxies to the Go app over the internal compose
  # network via UNIX socket.
  nginx:
    image: nginx:1.27-alpine           # pinned minor; bump deliberately after review
    <<: *default-hardening
    user: "101:101"                    # 'nginx' user in Alpine
    ports:
      - "127.0.0.1:8443:8443"          # Tor HiddenServicePort target; loopback ONLY
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./web/static:/var/www/static:ro
      - appsock:/run/onionshop
    depends_on:
      app:
        condition: service_healthy
    networks: [internal_net]
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://app:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 2. Go Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    <<: *default-hardening
    user: "1000:1000"                  # unprivileged app user
    environment:
      - ONIONSHOP_ADDR=0.0.0.0:8080    # contained-namespace bind
      - ONIONSHOP_NET_NEVER=1          # declares the NET_NEVER sandbox
      - ONIONSHOP_UNIX=/run/onionshop/app.sock
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - BTCPAY_API_URL=http://btcpay:49392
      - BTCPAY_API_KEY=${BTCPAY_API_KEY}
      - SESSION_HASH_KEY=${SESSION_HASH_KEY}
      - ONIONSHOP_SECURE_COOKIES=true
      - APP_ENV=production
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [internal_net]
    tmpfs: [/tmp]
    volumes:
      - appsock:/run/onionshop
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 3. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    <<: *default-hardening
    user: "999:999"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal_net]
    tmpfs: [/var/run/postgresql, /tmp]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Redis
  redis:
    image: redis:7-alpine
    <<: *default-hardening
    user: "999:999"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb --maxmemory-policy noeviction
      --bind 0.0.0.0
      --save "" --appendonly no
      --rename-command FLUSHALL "" --rename-command DEBUG "" --rename-command CONFIG ""
    networks: [internal_net]
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5. BTCPay Server
  btcpay:
    image: btcpayserver/btcpayserver@sha256:e63283733215286ef2e987178c773950fb1f81f9b31d279f04620f4c00000000
    restart: unless-stopped
    user: "1000:1000"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    environment:
      - BTCPAY_POSTGRES=User ID=${DB_USER};Password=${DB_PASSWORD};Host=btcpaydb;Port=5432;Database=btcpay
      - BTCPAY_NETWORK=mainnet
      - BTCPAY_BIND=0.0.0.0:49392
      - BTCPAY_ROOTPATH=/
    depends_on:
      btcpaydb: { condition: service_healthy }
    networks: [internal_net, btcpay_net]

  btcpaydb:
    image: postgres:16-alpine
    <<: *default-hardening
    user: "999:999"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: btcpay
    volumes:
      - btcpay_pgdata:/var/lib/postgresql/data
    networks: [btcpay_net]
    tmpfs: [/var/run/postgresql, /tmp]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d btcpay"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 6. Encrypted Backup Runner
  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    <<: *default-hardening
    entrypoint: ["/bin/sh", "-c", "exec /scripts/backup.sh"]
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - backup_data:/backup
    environment:
      - AGE_PUBLIC_KEY=${AGE_PUBLIC_KEY}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    networks: [internal_net]
    tmpfs: [/tmp]

volumes:
  pgdata:
  btcpay_pgdata:
  backup_data:
  appsock:

networks:
  internal_net:
    driver: bridge
    internal: true
  btcpay_net:
    driver: bridge
