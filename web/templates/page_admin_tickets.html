{{template "layout" .}}
{{define "title"}}Admin · Tickets · OnionShop{{end}}
{{define "body"}}
<section class="admin-layout">
  <div class="admin-header"><h1>Support Tickets</h1><a href="/admin" class="btn-secondary">← Dashboard</a></div>
  <div class="table-container">
    <table class="data-table">
      <thead><tr><th>Subject</th><th>Category</th><th>Status</th><th>Updated</th></tr></thead>
      <tbody>
      {{if .Tickets}}
        {{range .Tickets}}
        <tr>
          <td><a href="/admin/tickets/{{.IDStr}}">{{.Subject}}</a></td>
          <td>{{.Category}}</td>
          <td><span class="badge badge-success">{{.Status}}</span></td>
          <td>{{.UpdatedAt}}</td>
        </tr>
        {{end}}
      {{else}}
        <tr><td colspan="4" class="text-muted" style="text-align:center;">No tickets.</td></tr>
      {{end}}
      </tbody>
    </table>
  </div>
</section>
{{end}}
