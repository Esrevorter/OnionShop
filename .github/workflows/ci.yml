name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # CRITICAL: pin the EXACT toolchain (not go-version-file, not "stable").
      # Root cause of the recurring `undefined: chi/scs/pgx/redis` typecheck
      # cascade (verified against raw CI logs of run 41276126361): the
      # staticcheck action re-invokes setup-go with version "stable", which on
      # current runner images installs Go 1.27.3 and OVERWRITES PATH/GOROOT for
      # every later step. golangci-lint v1.64.8 is built with Go 1.23/1.24
      # libraries and cannot parse export data emitted by newer compilers, so
      # its packages.Load typecheck fails to resolve all third-party imports —
      # while vet/staticcheck/download pass because they run on the new Go.
      # Pinning 1.23.12 here makes the whole job hermetic; see final check below.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
      - name: Assert toolchain integrity
        run: |
          echo "PATH order:"; echo "$PATH" | tr ':' '\n' | grep -i go | head -5
          go version
          go env GOTOOLCHAIN GOVERSION GOMODCACHE GOCACHE
          if ! go version | grep -q "go1\.23\."; then
            echo "::error::CI must run Go 1.23.x for golangci-lint v1.64.8 compatibility" >&2
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: Purge stale golangci-lint / Go build caches
        # Defense-in-depth against cache staleness: even with skip-cache,
        # deeper binary/module caches (~/.cache/golangci-lint, GOCACHE) can
        # serve stale typecheck findings from a previous broken-go.mod state.
        # Wipe them so the lint step always analyzes from cold truth, exactly
        # like the passing vet step does.
        run: |
          rm -rf ~/.cache/golangci-lint "${RUNNER_TEMP}/golangci-lint-cache" || true
          go clean -cache -testcache
      - name: golangci-lint
        # Raw `go run` (no action wrapper) executes in exactly the same
        # toolchain env as the passing vet step; @v1.64.8 pins the binary;
        # behavior pinned by .golangci.yml. GOTOOLCHAIN=local guarantees no
        # silent switch to a newer toolchain mid-step.
        env:
          GOTOOLCHAIN: local
        run: go run github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8 run --timeout 5m ./...
      - name: govulncheck
        env:
          GOTOOLCHAIN: auto
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: test
        run: go test ./...

  sqlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sqlc generate (verifies queries compile against schema)
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.27.0"
      - run: sqlc generate
