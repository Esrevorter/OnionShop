{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{block "title" .}}OnionShop{{end}}</title>
<style>
body{font-family:monospace;max-width:640px;margin:2rem auto;padding:0 1rem;background:#111;color:#ddd}
a{color:#7fb3ff}
form{margin-top:1rem}
label{display:block;margin:.75rem 0 .25rem}
input{width:100%;padding:.4rem;background:#222;color:#eee;border:1px solid #444}
.hp{position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden}
.err{color:#ff8080}.flash{color:#80ffb0}
.captcha-img{background:#fff;padding:.25rem;display:inline-block}
nav a{margin-right:1rem}
.inert-url{border-bottom:1px dotted #666;user-select:all}
</style>
</head>
<body>
<nav>
<a href="/">Home</a>
{{if .PersonalPhrase}}<span title="anti-phishing phrase">&#10003; {{.PersonalPhrase}}</span>{{end}}
</nav>
{{if .Error}}<p class="err">{{.Error}}</p>{{end}}
{{if .Flash}}<p class="flash">{{.Flash}}</p>{{end}}
{{block "body" .}}{{end}}
</body>
</html>
{{end}}
