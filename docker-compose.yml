version: '3.8'

# Production-ready, high-OpSec Docker Compose for OnionShop
# WARNING: This file relies on a .env file for ALL secrets. NEVER commit .env to Git.
# The host machine MUST have LUKS full-disk encryption enabled.

services:
  # 1. Nginx Reverse Proxy (The Gatekeeper)
  # Binds ONLY to 127.0.0.1:8080 on the host, where the Tor daemon forwards traffic.
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    user: "101:101" # 'nginx' user in Alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./web/static:/var/www/static:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal_net
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 2. Go Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "1000:1000" # Non-root user (ensure this UID/GID is used in your Dockerfile)
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - BTCPAY_API_URL=http://btcpay:49392
      - APP_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal_net
    read_only: true
    tmpfs:
      - /tmp # For temporary file processing (e.g., PGP, QR codes)
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 3. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    user: "999:999" # 'postgres' user in Alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal_net
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Redis (Session & Rate Limiting)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    user: "999:999" # 'redis' user in Alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy noeviction --bind 0.0.0.0
    volumes:
      - redisdata:/data
    networks:
      - internal_net
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5. BTCPay Server 
  # Note: BTCPay requires outbound access for blockchain sync. 
  # It is placed on 'btcpay_net' for outbound, but ALSO on 'internal_net' so the App can reach it.
  btcpay:
    image: btcpayserver/btcpayserver:latest
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - BTCPAY_POSTGRES=User ID=${DB_USER};Password=${DB_PASSWORD};Host=btcpaydb;Port=5432;Database=btcpay
      - BTCPAY_NETWORK=mainnet
      - BTCPAY_BIND=0.0.0.0:49392
      - BTCPAY_ROOTPATH=/
    depends_on:
      btcpaydb:
        condition: service_healthy
    networks:
      - internal_net
      - btcpay_net
    read_only: true
    tmpfs:
      - /tmp

  btcpaydb:
    image: postgres:16-alpine
    restart: unless-stopped
    user: "999:999"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: btcpay
    volumes:
      - btcpay_pgdata:/var/lib/postgresql/data
    networks:
      - btcpay_net
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d btcpay"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 6. Encrypted Backup Runner (Daily Cron)
  backup:
    image: alpine:latest
    restart: unless-stopped
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - backup_data:/backup
      - pgdata:/pgdata_source:ro # Read-only mount of DB volume for safe dumping
    environment:
      - AGE_PUBLIC_KEY=${AGE_PUBLIC_KEY}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    command: /scripts/backup.sh
    networks:
      - internal_net
    read_only: true
    tmpfs:
      - /tmp # Unencrypted dumps happen here briefly in RAM before encryption

volumes:
  pgdata:
  redisdata:
  btcpay_pgdata:
  backup_data:

networks:
  internal_net:
    driver: bridge
    internal: true # CRITICAL: No outbound internet access for App, DB, Redis, Nginx
  btcpay_net:
    driver: bridge
    # No 'internal: true' here; BTCPay needs outbound access to sync the blockchain
