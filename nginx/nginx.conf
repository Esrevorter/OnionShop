# OnionShop nginx reverse proxy.
# Tor Browser-only product policy is documented in INSTALL.md and
# SECURITY_AND_OPSEC.md. The configured self-signed certificate is a separate
# ECDSA TLS key with an exact onion DNS SAN; it is NOT the Tor Ed25519 key.
# Tor protocol authentication is independent of TLS certificate validation.
# Never add CA-issued certificate requirements, SPKI pins, or hash pins here.

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    access_log off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # TLS 1.3 only. Tor Browser validates the URL hostname against the DNS SAN;
    # this config does not bypass certificate warnings or add a trust anchor.
    ssl_protocols TLSv1.3;
    ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    upstream onionshop {
        server unix:/run/onionshop/app.sock max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 8443 ssl;
        http2 on;
        # Certificate contains the operator's exact v3 onion hostname as DNS SAN.
        # Default server_name is intentional: no clearnet hostname is configured.
        server_name _;
        ssl_certificate     /etc/nginx/ssl/onion.crt;
        ssl_certificate_key /etc/nginx/ssl/onion.key;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_pass_request_headers on;

        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; upgrade-insecure-requests" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        client_max_body_size 64k;
        client_body_timeout 10s;
        send_timeout 30s;
        keepalive_timeout 30s;

        location /health {
            proxy_pass http://onionshop/healthz;
            access_log off;
        }

        location /static/ {
            alias /var/www/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location / {
            proxy_pass http://onionshop;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_buffering on;
        }
    }
}
