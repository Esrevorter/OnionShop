# Development/preview stack; production use is gated by PRODUCTION_READINESS.md.
# TLS cert/key must be generated for the exact ONION_HOST using scripts/gen-certs.sh.
# This is a self-signed ECDSA TLS key separate from Tor's Ed25519 key. Tor's
# protocol authenticates the onion endpoint; the TLS certificate does not.
# No CA-issued TLS certs or SPKI/hash pinning are used by project policy.
# Secrets come from a private .env. Docker network isolation is not a substitute
# for an audited host firewall and per-service egress policy.

x-hardening: &default-hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  read_only: true
  tmpfs:
    - /tmp
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "2" }

services:

  # 1. Nginx Reverse Proxy (The Gatekeeper)
  # Terminates TLS 1.3 on loopback only and proxies to the Go app over the
  # shared UNIX socket. group_add grants the socket's group (app gid 1000):
  # the socket is 0770 app:app, and nginx runs as 101:101.
  nginx:
    image: nginx:1.27-alpine           # pinned minor; bump deliberately after review
    <<: *default-hardening
    mem_limit: 200m
    pids_limit: 128
    user: "101:101"                    # 'nginx' user in Alpine
    group_add: ["1000"]                # supplementary access to app.sock (0770)
    ports:
      # Configurable bind IP. Default 127.0.0.1 for safety. 
      # Whonix-Workstation deployments MUST set NGINX_BIND_IP=0.0.0.0 in .env
      # AND enforce a host firewall restricting access to the Gateway's IP.
      - "${NGINX_BIND_IP:-127.0.0.1}:8080:8080"          # Tor HiddenServicePort 80 target
      - "${NGINX_BIND_IP:-127.0.0.1}:8443:8443"          # Tor HiddenServicePort 443 target
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./web/static:/var/www/static:ro
      - uploads_data:/var/www/uploads:ro
      - appsock:/run/onionshop
    depends_on:
      app:
        condition: service_healthy
    networks: [internal_net, edge_net]
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:mode=1777
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "--tries=1",
             "-O", "/dev/null", "https://127.0.0.1:8443/health"]
      interval: 30s
      timeout: 5s
      retries: 3  

  app:
    image: onionshop-app:local
    build:
      context: .
      dockerfile: Dockerfile
    <<: *default-hardening
    user: "1000:101"
    environment:
      - ONIONSHOP_UNIX=/run/onionshop/app.sock
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - SESSION_HASH_KEY=${SESSION_HASH_KEY}
      - ONIONSHOP_SECURE_COOKIES=true
      - APP_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1500m
    pids_limit: 256
    networks: [internal_net]
    tmpfs: [/tmp]
    volumes:
      - appsock:/run/onionshop
      - uploads_data:/var/lib/onionshop/uploads
    healthcheck:
      test: ["CMD", "/usr/local/bin/onionshop", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  postgres:
    image: postgres:16-alpine # tag-only; verify/pin digest before production
    <<: *default-hardening
    user: "999:999"
    mem_limit: 2000m
    pids_limit: 256
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal_net]
    tmpfs:
      - /var/run/postgresql:mode=1777
      - /tmp:mode=1777
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine # tag-only; verify/pin digest before production
    <<: *default-hardening
    mem_limit: 512m
    pids_limit: 256
    user: "999:999"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb --maxmemory-policy noeviction
      --bind 0.0.0.0
      --save "" --appendonly no
      --rename-command FLUSHALL "" --rename-command DEBUG "" --rename-command CONFIG ""
    networks: [internal_net]
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Monero Node (monerod)
  # Own node is mandatory for OpSec. Syncs via host's Tor daemon to protect IP.
  monerod:
    entrypoint: ["monerod"]
    # TODO: REPLACE PLACEHOLDER DIGEST with actual digest from registry.
    # Run: docker pull ghcr.io/sethforprivacy/simple-monerod:v0.18.3.3
    # Run: docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/sethforprivacy/simple-monerod:v0.18.3.3
    image: ghcr.io/sethforprivacy/simple-monerod@sha256:d0e5c768e38870ccd22a9a07b3ebe4b2d0f12988388bab499cfa45d08273d4b1
    user: "1000:1000"
    security_opt:
      - no-new-privileges:false
    <<: *default-hardening
    mem_limit: 2000m
    pids_limit: 512
    environment:
      - PUID=1000
      - PGID=1000
    # Command flags enforce pruned sync, Tor routing, and strict RPC lockdown.
    # host.docker.internal resolves to the host machine's loopback to reach Tor.
    read_only: false  # Override anchor: fixuid needs write access
    command: >
      --testnet
      --prune-blockchain
      --sync-pruned-blocks
      --p2p-bind-ip 127.0.0.1
      --pad-transactions
      --no-igd
      --hide-my-port
      --no-zmq
      --enable-dns-blocklist
      --enforce-dns-checkpointing
      --check-updates=disabled
      --rpc-bind-ip 0.0.0.0
      --confirm-external-bind
      --rpc-bind-port 18081
      --rpc-login monero:moneropassword
    volumes:
      - /mnt/secure_monero/daemon:/home/monero/.bitmonero
    networks: [internal_net]
    tmpfs: [/tmp]
    healthcheck:
      # Basic RPC check to verify the daemon is responsive
      test: ["CMD-SHELL", "wget -qO- --user=monero --password=moneropassword http://127.0.0.1:18081/get_height || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 300s

  # 3. Monero Wallet RPC (escrow hot wallet)
  # Provides the JSON-RPC the Go MoneroProvider calls to mint per-order
  # subaddresses and poll for confirmations. Stays on internal_net ONLY: no
  # host port is published, so the RPC is reachable by the app container but
  # never by the host or the internet. The wallet file lives in a named volume.
  monero-wallet-rpc:
    image: ${WALLET_RPC_IMAGE:-ghcr.io/sethforprivacy/simple-monero-wallet-rpc:v0.18.3.3}
    entrypoint: ["monero-wallet-rpc"]
    command:
      - --testnet
      - --wallet-dir=/home/monero/wallet_data
      - --wallet-file=/home/monero/wallet_data/onionshop
      - --password=testpass123
      - --daemon-address=http://monerod:18081
      - --rpc-bind-ip=0.0.0.0
      - --rpc-bind-port=18083
      - --disable-rpc-login
      - --confirm-external-bind
      - --trusted-daemon
      - --non-interactive
    <<: *default-hardening
    read_only: false
    security_opt:
      - no-new-privileges:false
    mem_limit: 1000m
    pids_limit: 256
    depends_on:
      - monerod
    networks: [internal_net]
    tmpfs: [/tmp]
    volumes:
      - /mnt/secure_monero/wallet:/home/monero/wallet_data
    restart: unless-stopped
  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    <<: *default-hardening
    mem_limit: 1500m
    pids_limit: 128
    entrypoint: ["/bin/sh", "-c", "exec /scripts/backup.sh"]
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - backup_data:/backup
    environment:
      - AGE_PUBLIC_KEY=${AGE_PUBLIC_KEY}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    networks: [internal_net]
    tmpfs: [/tmp]

volumes:
  pgdata:
  backup_data:
  appsock:
  uploads_data:

networks:
  internal_net:
    driver: bridge
    internal: true
  # edge_net exists ONLY so nginx has a default gateway: Docker publishes ports
  # through the container's default-gateway network, and an internal-only
  # container has none, so `ports:` is silently ignored without this. Required
  # for host-side Tor (deploy/torrc) to reach 127.0.0.1:8443 in production too.
  edge_net:
    driver: bridge
