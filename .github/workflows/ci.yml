name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Lint toolchain pin (root cause of the recurring undefined
      # chi/scs/pgx/redis typecheck cascade — proven from raw CI logs):
      # golangci-lint v1.64.8 is built with Go 1.23/1.24 libraries and cannot
      # parse export data produced by newer compilers (Go 1.25+). Previously
      # the staticcheck action silently re-ran setup-go with "stable",
      # replacing PATH/GOROOT with Go 1.27.3 for every later step, so only the
      # lint step's packages.Load typecheck broke while vet/test passed.
      # This job therefore runs the whole pipeline on the pinned patched
      # toolchain below; no other step may overwrite it.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
      - name: Assert toolchain integrity
        run: |
          go version
          go env GOTOOLCHAIN GOVERSION GOMODCACHE GOCACHE
          if ! go version | grep -q "go1\.23\."; then
            echo "::error::CI must run Go 1.23.x for golangci-lint v1.64.8 compatibility" >&2
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: Purge stale golangci-lint / Go build caches
        # Defense-in-depth against cache staleness: even with skip-cache,
        # deeper binary/module caches (~/.cache/golangci-lint, GOCACHE) can
        # serve stale typecheck findings from a previous broken-go.mod state.
        # Wipe them so the lint step always analyzes from cold truth, exactly
        # like the passing vet step does.
        run: |
          rm -rf ~/.cache/golangci-lint "${RUNNER_TEMP}/golangci-lint-cache" || true
          go clean -cache -testcache
      - name: golangci-lint
        # Raw `go run` (no action wrapper) executes in exactly the same
        # toolchain env as the passing vet step; @v1.64.8 pins the binary;
        # behavior pinned by .golangci.yml. GOTOOLCHAIN=local forbids any
        # mid-step switch to a newer toolchain that would break export-data
        # parsing again.
        env:
          GOTOOLCHAIN: local
        run: go run github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8 run --timeout 5m ./...
      - name: test
        run: go test ./...

  # Vulnerability scanning runs on the CURRENT supported Go release, not the
  # lint-pinned 1.23.12: govulncheck's stdlib analysis reports vulnerabilities
  # present in the *build* toolchain, and Go 1.23 is EOL upstream (fixed only
  # in 1.26.x lines). Scanning at latest gives actionable results; production
  # images should be rebuilt on the same current release (see Dockerfile note).
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  sqlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sqlc generate (verifies queries compile against schema)
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.27.0"
      - run: sqlc generate
