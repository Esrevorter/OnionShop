version: "2"
sql:
  - engine: "postgresql"
    queries: "db/query"
    # db/schema.sql mirrors db/migrations/ (0001-0005) flattened for sqlc's
    # parser; keep it in sync when new migrations land.
    schema: "db/schema.sql"
    gen:
      go:
        package: "store"
        out: "internal/store/gen"
        sql_package: "pgx/v5"
        emit_exact_table_names: false
        emit_methods_with_db_argument: true
