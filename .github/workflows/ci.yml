name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "latest"
      - name: Purge stale golangci-lint / Go build caches
        # Defense-in-depth against cache staleness: even with skip-cache,
        # deeper binary/module caches (~/.cache/golangci-lint, GOCACHE) can
        # serve stale typecheck findings from a previous broken-go.mod state.
        # Wipe them so the lint step always analyzes from cold truth, exactly
        # like the passing vet step does.
        run: |
          rm -rf ~/.cache/golangci-lint
          go clean -cache -testcache
      - name: golangci-lint
        # ESCALATION (step 3 of the pin-and-purge plan): the action wrapper
        # golangci/golangci-lint-action@v6 is provably the culprit. Its logs
        # show it ran /home/runner/golangci-lint-1.64.8-linux-amd64/golangci-lint
        # with NO GOMODCACHE/GOPATH env overrides, so the tool resolved the
        # module graph against a STALE shared per-user Go env baked into the
        # runner image — producing undefined chi/scs/pgx/redis typecheck
        # cascades on commits whose go.mod/go.sum are verified-good, while
        # every raw-go step (vet/staticcheck/test) passed on the identical
        # checkout. Raw `go run` below executes in exactly the same toolchain
        # env as the passing vet step (setup-go's GOMODCACHE/GOCACHE), and
        # @v1.64.8 pins the same binary version we verified locally from a
        # cold cache (exit 0). Behavior stays pinned by .golangci.yml.
        env:
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint-cache
        run: |
          rm -rf "$GOLANGCI_LINT_CACHE"
          go run github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8 run --timeout 5m ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: test
        run: go test ./...

  sqlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sqlc generate (verifies queries compile against schema)
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.27.0"
      - run: sqlc generate
