version: '3.8'

# Development/preview stack; production use is gated by PRODUCTION_READINESS.md.
# Secrets come from a private .env. Do not treat Compose network isolation as
# a substitute for an audited host firewall and per-service egress policy.

x-hardening: &default-hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  read_only: true
  tmpfs:
    - /tmp
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "2" }

services:
  # One-shot owner/permission setup for the shared UNIX-socket volume.
  # It has no network and only CAP_CHOWN; app and nginx run unprivileged.
  socket-init:
    image: onionshop-app:local
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown 1000:101 /run/onionshop && chmod 0770 /run/onionshop"]
    user: "0:0"
    cap_add: [CHOWN]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    restart: "no"
    network_mode: none
    volumes:
      - appsock:/run/onionshop

  nginx:
    image: nginx:1.27-alpine # tag-only; verify/pin digest before production
    <<: *default-hardening
    user: "101:101"
    ports:
      - "127.0.0.1:8080:8080" # Tor onion port 80: HTTP->HTTPS redirect
      - "127.0.0.1:8443:8443" # Tor onion port 443: TLS endpoint
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./web/static:/var/www/static:ro
      - appsock:/run/onionshop
    depends_on:
      app:
        condition: service_healthy
    networks: [internal_net]
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    healthcheck:
      # This reaches nginx over TLS and exercises the nginx->app UNIX socket.
      # Certificate verification is intentionally skipped only for this local
      # liveness probe; it does not authenticate the service.
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "--tries=1", "-O", "/dev/null", "https://127.0.0.1:8443/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  app:
    image: onionshop-app:local
    build:
      context: .
      dockerfile: Dockerfile
    <<: *default-hardening
    user: "1000:101" # app uid, nginx socket-access group
    environment:
      - ONIONSHOP_ADDR=127.0.0.1:8080 # unused when UNIX socket is selected
      - ONIONSHOP_UNIX=/run/onionshop/app.sock
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - BTCPAY_API_URL=http://btcpay:49392
      - BTCPAY_API_KEY=${BTCPAY_API_KEY}
      - SESSION_HASH_KEY=${SESSION_HASH_KEY}
      - ONIONSHOP_SECURE_COOKIES=true
      - APP_ENV=production
    depends_on:
      socket-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal_net]
    tmpfs: [/tmp]
    volumes:
      - appsock:/run/onionshop
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/onionshop/app.sock"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  postgres:
    image: postgres:16-alpine # tag-only; verify/pin digest before production
    <<: *default-hardening
    user: "999:999"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal_net]
    tmpfs: [/var/run/postgresql, /tmp]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine # tag-only; verify/pin digest before production
    <<: *default-hardening
    user: "999:999"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb --maxmemory-policy noeviction
      --bind 0.0.0.0
      --save "" --appendonly no
      --rename-command FLUSHALL "" --rename-command DEBUG "" --rename-command CONFIG ""
    networks: [internal_net]
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  btcpay:
    # Digest reference reported for official stable 2.4.5 linux/amd64; verify
    # registry metadata and platform independently before production use.
    image: btcpayserver/btcpayserver@sha256:4c029e17e84600f740fb45652be5dfa906fe81e1c1a2789927e75954032f7c79
    restart: unless-stopped
    user: "1000:1000"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    environment:
      - BTCPAY_POSTGRES=User ID=${DB_USER};Password=${DB_PASSWORD};Host=btcpaydb;Port=5432;Database=btcpay
      - BTCPAY_NETWORK=mainnet
      - BTCPAY_BIND=0.0.0.0:49392
      - BTCPAY_ROOTPATH=/
    depends_on:
      btcpaydb: { condition: service_healthy }
    networks: [internal_net, btcpay_net]

  btcpaydb:
    image: postgres:16-alpine # tag-only; verify/pin digest before production
    <<: *default-hardening
    user: "999:999"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: btcpay
    volumes:
      - btcpay_pgdata:/var/lib/postgresql/data
    networks: [btcpay_net]
    tmpfs: [/var/run/postgresql, /tmp]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d btcpay"]
      interval: 10s
      timeout: 5s
      retries: 5

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    <<: *default-hardening
    entrypoint: ["/bin/sh", "-c", "exec /scripts/backup.sh"]
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - backup_data:/backup
    environment:
      - AGE_PUBLIC_KEY=${AGE_PUBLIC_KEY}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    networks: [internal_net]
    tmpfs: [/tmp]

volumes:
  pgdata:
  btcpay_pgdata:
  backup_data:
  appsock:

networks:
  internal_net:
    driver: bridge
    internal: true
  btcpay_net:
    driver: bridge
