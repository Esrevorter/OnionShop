name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "latest"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        # skip-cache: the action's incremental result cache can serve STALE
        # typecheck findings from a previous (broken go.mod) state even after
        # the module manifest is repaired — e.g. CI reported undefined
        # chi/scs/pgx/redis on a commit whose go.mod was already fixed, while
        # every non-cached step (vet/staticcheck) passed. Disable until we can
        # trust cache keys across dependency-graph repairs.
        with:
          version: latest
          skip-cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: test
        run: go test ./...

  sqlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sqlc generate (verifies queries compile against schema)
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.27.0"
      - run: sqlc generate
