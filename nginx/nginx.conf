# OnionShop nginx reverse proxy — hardened per SECURITY_AND_OPSEC.md.
# Serves TLS 1.3 ONLY on loopback (Tor terminates at .onion; this hop exists
# so that any direct-loopback access is still encrypted and pinned via SPKI).
# Proxies to the Go app over a UNIX socket — no TCP hop internally.

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    access_log off;                     # no request logs on disk (OpSec policy)
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;                  # never advertise the nginx version

    # --- Hardened TLS (self-signed cert; clients pin the SPKI fingerprint) ---
    ssl_protocols TLSv1.3;
    ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;
    ssl_prefer_server_ciphers off;      # TLS1.3: client preference is fine
    ssl_session_timeout 1h;
    ssl_session_tickets off;            # no session resumption across restarts
    add_header Strict-Transport-Security "max-age=15552000" always;  # HTTPS-only mode: HSTS allowed here (NOT in plain-HTTP onion mode)

    # --- Response security headers (mirrored by the Go layer; belt & braces) ---
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    upstream onionshop {
        server unix:/run/onionshop/app.sock max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen 127.0.0.1:8443 ssl;      # loopback ONLY; Tor HiddenServicePort points here
        http2 on;
        server_name _;                  # onion hostname is not a DNS name; do not leak one
        ssl_certificate     /etc/nginx/ssl/onion.crt;
        ssl_certificate_key /etc/nginx/ssl/onion.key;

        # Strip hop-by-hop + identifying headers on the way in
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_pass_request_headers on;

        # Outbound header hygiene: remove anything that could fingerprint the backend
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # NOTE: Cross-Origin-Opener-Policy / COEP intentionally omitted until tested; see ARCHITECTURE.md.

        client_max_body_size 64k;       # tiny: product images are served from static, uploads go through vendor flow later
        client_body_timeout 10s;
        send_timeout 30s;
        keepalive_timeout 30s;

        location /health {              # used by nginx's own healthcheck chain & ops
            proxy_pass http://onionshop/healthz;
            access_log off;
        }

        location /static/ {             # vendored assets, immutable cache
            alias /var/www/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location / {
            proxy_pass http://onionshop;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_buffering on;
        }
    }
}
